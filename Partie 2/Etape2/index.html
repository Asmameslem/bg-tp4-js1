<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">
        <table id="table_persons">
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>
            </thead>
            <tbody>
                <tr class="row">
                    <td class="col_number">1</td>
                    <td class="col_text">Nom1</td>
                    <td class="col_text">Prénom1</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox">
                        <input type="checkbox">
                    </td>
                </tr>
                <tr class="row">
                    <td class="col_number">2</td>
                    <td class="col_text">Nom2</td>
                    <td class="col_text">Prénom2</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox">
                        <input type="checkbox">
                    </td>
                </tr>
                <tr class="row">
                    <td class="col_number">3</td>
                    <td class="col_text">Nom3</td>
                    <td class="col_text">Prénom3</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox">
                        <input type="checkbox">
                    </td>
                </tr>
            </tbody>
        </table>
        <button onclick="doInsertRowTable(99, 'nom', 'prenom', 10)">
            Ajouter
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
